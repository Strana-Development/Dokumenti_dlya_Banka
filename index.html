const $ = id => document.getElementById(id);
const norm = s => s.toLocaleLowerCase('ru').replace(/ё/g,'е');
const split = n => { const m = n.match(/^(.*?)\s*\((.*)\)$/); return m ? [m[1], m[2]] : [n, '']; };
const hue = i => (i * 47 + 220) % 360;
const initials = n => { const c = n.replace(/[^A-Za-zА-Яа-яЁё]/g,''); return (c[0] || '?').toUpperCase(); };
function paint(el, i, name){ el.textContent = initials(name); el.style.background = `linear-gradient(135deg,hsl(${hue(i)} 70% 55%),hsl(${hue(i)+40} 70% 48%))`; }

function highlightMatch(text, q){
 if (!q) return document.createTextNode(text);
 const idx = norm(text).indexOf(q);
 if (idx === -1) return document.createTextNode(text);
 const frag = document.createDocumentFragment();
 frag.appendChild(document.createTextNode(text.slice(0, idx)));
 const mark = document.createElement('mark');
 mark.textContent = text.slice(idx, idx + q.length);
 frag.appendChild(mark);
 frag.appendChild(document.createTextNode(text.slice(idx + q.length)));
 return frag;
}

function updateClearBtn(){
 $('clearSearch').classList.toggle('show', $('search').value.length > 0);
}

function renderGrid(){
 const q = norm($('search').value.trim());
 const grid = $('grid'); grid.textContent = '';
 let n = 0;
 banks.forEach((b, i) => {
  if (q && !norm(b.name).includes(q)) return;
  const delay = Math.min(n, 16) * 25;
  n++;
  const [main, note] = split(b.name);
  const btn = document.createElement('button');
  btn.className = 'bank'; btn.type = 'button';
  btn.style.animationDelay = delay + 'ms';
  const av = document.createElement('div'); av.className = 'avatar'; paint(av, i, main);
  const tx = document.createElement('div');
  const nm = document.createElement('div'); nm.className = 'bname'; nm.appendChild(highlightMatch(main, q)); tx.appendChild(nm);
  if (note){ const nt = document.createElement('div'); nt.className = 'bnote'; nt.textContent = note; tx.appendChild(nt); }
  const ar = document.createElement('span'); ar.className = 'arrow'; ar.textContent = '›';
  btn.append(av, tx, ar);
  btn.addEventListener('click', () => { location.hash = '#/bank/' + i; });
  grid.appendChild(btn);
 });
 $('none').hidden = n > 0;
 $('count').textContent = q ? 'Найдено: ' + n : 'Всего банков: ' + banks.length;
}

function renderDetail(i){
 const b = banks[i]; const [main, note] = split(b.name);
 paint($('dAvatar'), i, main);
 $('dTitle').textContent = main;
 $('dSub').textContent = note || 'Список необходимых документов';
 const body = $('dBody'); body.textContent = '';
 b.docs.split('\n').forEach(l => {
  const t = l.trim(); if (!t) return;
  const num = t.match(/^(\d+)\.\s*(.*)$/);

  // Заголовок секции: заканчивается на ":" и начинается с заглавной кириллицы, не нумерованный
  if (t.endsWith(':') && /^[А-ЯЁ]/.test(t) && !num){
    const m = t.match(/^(.*?)\s*\((.+)\):$/);
    const sec = document.createElement('div'); sec.className = 'sec';
    if (m){
      sec.textContent = m[1];
      body.appendChild(sec);
      const nt = document.createElement('div'); nt.className = 'line note'; nt.textContent = m[2];
      body.appendChild(nt);
    } else {
      sec.textContent = t.slice(0, -1);
      body.appendChild(sec);
    }
    return;
  }

  let el;
  if (num){
    el = document.createElement('div'); el.className = 'item';
    const i2 = document.createElement('i'); i2.textContent = num[1];
    const s = document.createElement('span'); s.textContent = num[2];
    el.append(i2, s);
  } else {
    el = document.createElement('div'); el.className = 'line';
    if (/^(Срок действия|Учитываются|Справка предоставляется|Разведённые|ВНИМАНИЕ|Уточните|Эти документы|ВАЖНО!|Ссылка|МСК в первоначальный)/.test(t)) el.classList.add('note');
    el.textContent = t;
  }
  body.appendChild(el);
 });
 document.title = main + ' — документы';
}

function applyRoute(){
 const m = location.hash.match(/^#\/bank\/(\d+)$/);
 const i = m ? Number(m[1]) : -1;
 if (i >= 0 && i < banks.length){
  renderDetail(i); $('home').hidden = true; $('detail').hidden = false;
 } else {
  $('detail').hidden = true; $('home').hidden = false; document.title = 'Памятка по документам банков';
 }
 window.scrollTo(0, 0);
}

function route(){
 if (document.startViewTransition){
  document.startViewTransition(() => applyRoute());
 } else {
  applyRoute();
 }
}

$('search').addEventListener('input', () => { renderGrid(); updateClearBtn(); });
$('search').addEventListener('keydown', e => { if (e.key === 'Enter'){ const f = $('grid').querySelector('button'); if (f) f.click(); } });
$('clearSearch').addEventListener('click', () => { $('search').value = ''; renderGrid(); updateClearBtn(); $('search').focus(); });
$('back').addEventListener('click', () => { if (history.length > 1) history.back(); else location.hash = ''; });
$('print').addEventListener('click', () => window.print());
$('copy').addEventListener('click', async () => {
 const found = banks.find(b => split(b.name)[0] === $('dTitle').textContent);
 if (!found) return;
 const text = $('dTitle').textContent + '\n\n' + found.docs;
 const btn = $('copy');
 try { await navigator.clipboard.writeText(text); }
 catch(e){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
 btn.textContent = 'Скопировано ✓'; setTimeout(() => btn.textContent = 'Копировать', 1600);
});
window.addEventListener('hashchange', route);
renderGrid(); updateClearBtn(); applyRoute();
</script>
</body>
</html>
